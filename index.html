<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidey Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for a comic book feel -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom scrollbar for webkit browsers */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Font adjustments */
        .font-comic { font-family: 'Bangers', cursive; letter-spacing: 1px; }
        body { font-family: 'Roboto', sans-serif; }

        /* Spider-Web Background Pattern */
        .spider-bg {
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 100% 100%, rgba(220, 38, 38, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
        }
        
        /* Markdown-like styling for AI responses */
        .ai-message p { margin-bottom: 0.5rem; }
        .ai-message p:last-child { margin-bottom: 0; }
        .ai-message code { 
            background-color: #334155; 
            color: #e2e8f0;
            padding: 0.1rem 0.3rem; 
            border-radius: 0.2rem; 
            font-family: monospace;
            font-size: 0.9em;
        }
        .ai-message pre {
            background-color: #020617;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid #1e293b;
        }

        /* Typing indicator animation - Spidey Colors */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #ef4444; /* Red */
            color: #ef4444;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: "";
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -10px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #3b82f6; /* Blue */
            color: #3b82f6;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 10px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #ef4444; /* Red */
            color: #ef4444;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body class="spider-bg h-screen flex flex-col items-center justify-center text-gray-100">

    <!-- Main Chat Container -->
    <div class="w-full max-w-2xl h-full md:h-[90vh] bg-slate-900 md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-700 ring-1 ring-white/10">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-red-700 via-red-600 to-red-700 border-b border-red-800 p-4 flex items-center justify-between z-10 shadow-lg relative overflow-hidden">
            <!-- Subtle Web Pattern overlay on header -->
            <div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #000 10px, #000 12px);"></div>
            
            <div class="flex items-center gap-3 relative z-10">
                <div class="w-10 h-10 rounded-full bg-slate-900 border-2 border-slate-800 flex items-center justify-center text-red-500 shadow-md transform hover:scale-110 transition-transform duration-300">
                    <i class="fa-solid fa-spider text-xl"></i>
                </div>
                <div>
                    <h1 class="font-comic tracking-wider text-white text-xl md:text-2xl drop-shadow-md">SPIDEY ASSISTANT</h1>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                        <p class="text-xs text-red-100 font-medium opacity-90">Friendly Neighborhood AI</p>
                    </div>
                </div>
            </div>
            <button onclick="clearChat()" class="relative z-10 text-red-100 hover:text-white transition-colors p-2 rounded-full hover:bg-white/20" title="Clear Chat">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth bg-slate-900 relative">
            <!-- Background Watermark (Optional) -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.03]">
                <i class="fa-solid fa-spider text-9xl text-white"></i>
            </div>
            
            <!-- Welcome Message -->
            <div class="relative flex flex-col items-center justify-center h-full text-center space-y-4 opacity-70" id="welcome-screen">
                <div class="w-20 h-20 bg-slate-800 rounded-full border border-slate-700 flex items-center justify-center text-red-500 text-3xl shadow-lg ring-4 ring-slate-800/50">
                    <i class="fa-solid fa-mask"></i>
                </div>
                <div>
                    <h3 class="font-comic text-2xl text-slate-200 tracking-wide">With great power...</h3>
                    <p class="text-sm text-slate-400 max-w-xs mt-2 font-medium">Comes great answers! Ask me anything, web-slinger.</p>
                </div>
            </div>

            <!-- Messages will be inserted here -->
            
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-slate-900 border-t border-slate-800">
            <div class="relative flex items-end gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all shadow-inner">
                <textarea 
                    id="user-input" 
                    rows="1" 
                    class="w-full bg-transparent border-none focus:ring-0 text-slate-200 placeholder-slate-500 resize-none py-3 px-2 max-h-32" 
                    placeholder="Type your message..."
                    oninput="autoResize(this)"
                    onkeydown="handleEnter(event)"
                ></textarea>
                <button 
                    onclick="sendMessage()" 
                    id="send-btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-lg shadow-lg shadow-blue-900/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0 mb-0.5 transform active:scale-95"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <p class="text-center text-xs text-slate-600 mt-2 font-medium">AI generated. Trust your Spidey-Sense (and verify).</p>
        </div>

    </div>

    <script>
        // CONFIGURATION: Set your backend URL here
        const API_URL = '/chat';

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            if(textarea.value === '') textarea.style.height = 'auto';
        }

        // Handle Enter key
        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Create Message HTML
        function createMessageElement(content, isUser) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full relative z-10 ${isUser ? 'justify-end' : 'justify-start'}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = `max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3.5 shadow-md text-sm md:text-base leading-relaxed ${
                isUser 
                ? 'bg-blue-600 text-white rounded-br-sm shadow-blue-900/20' 
                : 'bg-slate-800 border border-slate-700 text-slate-200 rounded-bl-sm ai-message shadow-black/20'
            }`;
            
            // Simple text formatting for AI
            if (!isUser) {
                // Convert newlines to breaks for basic formatting if raw text
                content = content.replace(/\n/g, '<br>');
            }

            messageBubble.innerHTML = content;
            wrapper.appendChild(messageBubble);
            return wrapper;
        }

        // Create Loading Indicator
        function createLoadingElement() {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex w-full justify-start relative z-10';
            wrapper.id = 'loading-indicator';
            
            const bubble = document.createElement('div');
            bubble.className = 'bg-slate-800 border border-slate-700 rounded-2xl rounded-bl-sm px-5 py-4 shadow-md';
            
            const loader = document.createElement('div');
            loader.className = 'dot-flashing mx-2 my-1';
            
            bubble.appendChild(loader);
            wrapper.appendChild(bubble);
            return wrapper;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Hide welcome screen on first message
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            // Disable input
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Add User Message
            chatContainer.appendChild(createMessageElement(message, true));
            scrollToBottom();

            // Add Loading Indicator
            const loadingEl = createLoadingElement();
            chatContainer.appendChild(loadingEl);
            scrollToBottom();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                // Remove loading indicator
                loadingEl.remove();

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.text(); 
                
                // Add AI Message
                chatContainer.appendChild(createMessageElement(data, false));

            } catch (error) {
                console.error('Error:', error);
                loadingEl.remove();
                chatContainer.appendChild(createMessageElement('My web-shooters are jammed (Backend Error). Please check connection.', false));
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                scrollToBottom();
            }
        }

        function clearChat() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
